name: Validate stack config

on:
  push:
  pull_request:

jobs:
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Check referenced volume paths exist
        run: |
          set -e
          for dir in app filebeat logstash/pipeline logs nagios/conf.d; do
            test -d "$dir" || { echo "Missing expected directory: $dir"; exit 1; }
          done

  smoke-test:
    runs-on: ubuntu-latest
    needs: compose-config
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for Elasticsearch, Kibana, and Kafka to report healthy
        run: |
          set -e
          for svc in elasticsearch kibana kafka; do
            echo "Waiting for $svc..."
            timeout 180 bash -c "
              until [ \"\$(docker inspect -f '{{.State.Health.Status}}' \$(docker compose ps -q $svc))\" = 'healthy' ]; do
                sleep 5
              done
            " || { echo "$svc never became healthy"; docker compose logs "$svc"; exit 1; }
          done

      - name: Wait for a log document to reach Elasticsearch
        run: |
          set -e
          echo "Waiting for the app -> Filebeat -> Kafka -> Logstash -> Elasticsearch pipeline to index a document..."
          timeout 180 bash -c '
            until curl -sf "http://localhost:9200/logs-*/_count" 2>/dev/null | grep -qE "\"count\":[1-9]"; do
              sleep 5
            done
          ' || { echo "No documents indexed within timeout"; docker compose logs filebeat logstash elasticsearch; exit 1; }

      - name: Assert the pipeline parses structured fields correctly
        run: |
          set -e
          doc=$(curl -sf "http://localhost:9200/logs-*/_search?size=1&q=level:ERROR")
          echo "$doc" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          hits = d['hits']['hits']
          assert hits, 'no ERROR-level document found'
          src = hits[0]['_source']
          for field in ('level', 'msg', 'user_id', '@timestamp'):
              assert field in src, f'missing expected field: {field}'
          print('OK: found parsed document with fields', list(src.keys()))
          "

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
