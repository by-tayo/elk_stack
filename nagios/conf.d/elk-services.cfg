# Custom host/service definitions for the ELK stack demo.
# Dropped into /opt/nagios/etc/conf.d, which the base image's nagios.cfg
# already auto-loads via `cfg_dir=/opt/nagios/etc/conf.d`. Templates used
# here (linux-server, local-service) ship with the base jasonrivers/nagios
# image in objects/templates.cfg.

define host {
  use             linux-server
  host_name       elasticsearch
  alias           Elasticsearch
  address         elasticsearch
}

define host {
  use             linux-server
  host_name       kibana
  alias           Kibana
  address         kibana
}

define service {
  use                     local-service
  host_name               elasticsearch
  service_description     Elasticsearch HTTP
  check_command           check_http!-p 9200 -u /
}

define service {
  use                     local-service
  host_name               kibana
  service_description     Kibana HTTP
  check_command           check_http!-p 5601 -u /login
}
